# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ideaVersion: '2025.2.6.4'
            ideaPlatform: IU
            javaVersion: '21'
          - ideaVersion: '2025.3.6.2'
            ideaPlatform: IU
            javaVersion: '21'
          - ideaVersion: '2026.1.5.1'
            ideaPlatform: IU
            javaVersion: '21'
          - ideaVersion: '2026.2.4'
            ideaPlatform: IU
            javaVersion: '25'
          - ideaVersion: '2026.3'
            ideaPlatform: IU
            javaVersion: '25'

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK ${{ matrix.javaVersion }}
      uses: actions/setup-java@v6.1.0
      with:
        java-version: ${{ matrix.javaVersion }}
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        IDEA_VERSION: ${{ matrix.ideaVersion }}
        IDEA_PLATFORM: ${{ matrix.ideaPlatform }}
        IDEA_SOURCES: false
      run: xvfb-run ./gradlew test verifyPlugin
    - name: Set up Snyk CLI
      if: matrix.ideaVersion == '2025.2.6.4'
      uses: snyk/actions/setup@master
    - name: Run Snyk to check for vulnerabilities
      if: matrix.ideaVersion == '2025.2.6.4'
      env:
        IDEA_VERSION: ${{ matrix.ideaVersion }}
        IDEA_PLATFORM: ${{ matrix.ideaPlatform }}
        IDEA_SOURCES: false
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: snyk test --configuration-matching="^runtimeClasspath$" -- --no-configuration-cache
