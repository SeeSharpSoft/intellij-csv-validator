# Publish the plugin to JetBrains Marketplace and GitHub Releases.

name: Publish

on:
  push:
    branches: [ Stable ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ideaVersion: 2025.2

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        IDEA_PLATFORM: IC
        IDEA_VERSION: ${{ matrix.ideaVersion }}
        IDEA_SOURCES: false
        JI_CHANNELS: Stable
        JI_TOKEN: ${{ secrets.JI_TOKEN }}
      run: xvfb-run ./gradlew publishPlugin

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        VERSION=$(sed -n 's/^pluginVersion=//p' gradle.properties)
        gh release create "$VERSION" build/distributions/*.zip \
          --target "$GITHUB_SHA" \
          --title "Release $VERSION" \
          --generate-notes
