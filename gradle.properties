# Available idea versions:
# https://www.jetbrains.com/intellij-repository/releases
# https://www.jetbrains.com/intellij-repository/snapshots

pluginName=CSV Editor
pluginId=net.seesharpsoft.intellij.plugins.csv
pluginVersion=252.53.0

platform = IC
# LATEST-EAP-SNAPSHOT
platformVersion = 2025.2

org.gradle.parallel=true

# Preserve the default exclusions and avoid Ultimate's obfuscated class-name collisions in the flat test classloader.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue,com.intellij.modules.ultimate

# Opt-out flag for bundling Kotlin standard library.
# See https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library for details.
kotlin.stdlib.default.dependency=false
